# Nextcloud instance with the FaceRecognition app installed, to check that the
# app actually works.
#
#     docker compose -f docker/compose.yaml up -d --build
#
# Then open http://localhost:8080 and log in as admin/admin.
#
# See docker/README.md for the details.

name: facerecognition

services:
  db:
    image: mariadb:11.4
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    restart: unless-stopped
    volumes:
      - db:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: nextcloud
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: nextcloud
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXTCLOUD_VERSION: ${NEXTCLOUD_VERSION:-34}
    image: facerecognition-nextcloud:${NEXTCLOUD_VERSION:-34}
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - nextcloud:/var/www/html
      # Uncomment to develop against the working copy instead of the copy of
      # the app that is baked into the image. Note that you still need to
      # build the assets on the host (`make`), since the sources alone are
      # not enough to run the app.
      #- ..:/var/www/html/custom_apps/facerecognition:ro
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1"
      # Initial setup of the app, done on the first start.
      FACERECOGNITION_MEMORY: ${FACERECOGNITION_MEMORY:-1G}
      FACERECOGNITION_MODEL: ${FACERECOGNITION_MODEL:-1}
      FACERECOGNITION_IMAGE_AREA: ${FACERECOGNITION_IMAGE_AREA:-1048576}

  # Regular Nextcloud cron. It does not run the analysis: that one is still
  # up to you, with `occ face:background_job`.
  cron:
    image: facerecognition-nextcloud:${NEXTCLOUD_VERSION:-34}
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - nextcloud:/var/www/html

volumes:
  db:
  nextcloud:
